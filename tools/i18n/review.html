<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finnish translation review · GymTrack</title><link rel="stylesheet" href="/review.css"></head>
<body><header><div><h1>Finnish translations</h1><p>Drafts are already usable. Your edits join the next app release.</p></div><button id="check">Check now</button><button id="export">Export backup</button><label class="button">Import backup<input id="import" type="file" accept="application/json" hidden></label><label class="button">Import exercises<input id="exercises" type="file" accept="application/json" hidden></label></header>
<p id="message" role="status" aria-live="polite"></p><p id="summary"></p><main><aside><label>Search<input id="search" type="search" placeholder="English, Finnish or context"></label><div class="filters"><label>Status<select id="status"><option value="pending">Needs attention</option><option value="all">All</option><option value="approved">Approved</option><option value="draft">Draft</option><option value="needs-review">Needs review</option><option value="missing">Missing</option><option value="retired">Retired</option></select></label><label>Screen<select id="screen"><option value="all">All screens</option></select></label></div><nav id="list" aria-label="Translations"></nav></aside>
<section id="editor" hidden><div class="editor-heading"><h2 id="heading"></h2><span id="badge"></span></div><p id="context"></p><label>English<div id="english" class="readbox"></div></label><label>Finnish<textarea id="finnish" rows="4"></textarea></label><p id="saveState">Saved</p><label>Sample preview<div id="preview" class="readbox" lang="fi"></div></label><p id="suggestion" hidden></p><button id="useSuggestion" hidden>Use suggestion in editor</button><div class="actions"><button id="approve" class="primary">Approve and next</button><button id="save">Save draft</button><button id="regenerate">New suggestion</button><button id="skip">Skip</button></div><details><summary>Entry details and history</summary><code id="key"></code><p id="revision"></p><div id="history"></div></details></section><section id="empty"><h2>Nothing to review here</h2><p>Change the filters to browse other translations.</p></section></main><script src="/review.js"></script></body></html>
