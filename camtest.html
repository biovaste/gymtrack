<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GymTrack — camera capability probe</title>
<style>
  :root { color-scheme: dark; }
  body { font: 16px/1.5 -apple-system, system-ui, sans-serif; background: #12151c; color: #e8ecf3;
         margin: 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); }
  h1 { font-size: 19px; margin: 0 0 4px; }
  p.sub { color: #8b95a7; font-size: 14px; margin: 0 0 18px; }
  button { font: inherit; font-weight: 600; width: 100%; padding: 14px; margin-top: 10px;
           border-radius: 12px; border: 1px solid #2c3445; background: #1b2130; color: #e8ecf3; }
  button.primary { background: #3ecf8e; border-color: #3ecf8e; color: #06210f; }
  button:disabled { opacity: .45; }
  pre { background: #0c0f15; border: 1px solid #2c3445; border-radius: 12px; padding: 12px;
        font-size: 12.5px; white-space: pre-wrap; word-break: break-word; margin-top: 14px; }
  .ok { color: #3ecf8e; } .warn { color: #f2b544; } .bad { color: #f2685c; }
  video { width: 100%; border-radius: 12px; margin-top: 12px; background: #000; }
</style>
</head>
<body>
<h1>Camera capability probe</h1>
<p class="sub">Finds out what frame rate iOS will actually hand a web page. Nothing is uploaded or saved — this page only reads what your browser reports.</p>

<button class="primary" id="run">Run the probe</button>
<button id="rec" disabled>Record 3s and measure real fps</button>
<video id="preview" playsinline muted></video>
<pre id="out">Tap "Run the probe".</pre>

<script>
const out = document.getElementById('out');
const log = (s, cls) => { out.innerHTML += (cls ? `<span class="${cls}">${s}</span>` : s) + '\n'; };
let stream = null, track = null;

document.getElementById('run').addEventListener('click', async () => {
  out.innerHTML = '';
  log('UA: ' + navigator.userAgent + '\n');

  const supported = navigator.mediaDevices?.getSupportedConstraints?.() || {};
  log('frameRate constraint supported: ' + (supported.frameRate ? 'yes' : 'NO'));
  log('MediaRecorder present: ' + ('MediaRecorder' in window ? 'yes' : 'NO'));
  if ('MediaRecorder' in window) {
    const types = ['video/mp4', 'video/mp4;codecs=h264', 'video/webm', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8'];
    log('  supported types: ' + types.filter(t => MediaRecorder.isTypeSupported(t)).join(', ') || '  none');
  }
  log('');

  // Ask for the highest rate we could ever want and see what the OS grants.
  for (const want of [240, 120, 60, 30]) {
    try {
      const s = await navigator.mediaDevices.getUserMedia({
        video: { frameRate: { ideal: want }, facingMode: 'environment' }, audio: false
      });
      const t = s.getVideoTracks()[0];
      const st = t.getSettings();
      const caps = t.getCapabilities ? t.getCapabilities() : {};
      const granted = st.frameRate;
      const cls = granted >= 120 ? 'ok' : granted >= 60 ? 'warn' : 'bad';
      log(`asked ${want}fps -> granted ${granted}fps @ ${st.width}x${st.height}`, cls);
      if (caps.frameRate) log(`   device reports max ${caps.frameRate.max}fps`);
      if (want === 240) { stream = s; track = t; document.getElementById('preview').srcObject = s; document.getElementById('preview').play(); document.getElementById('rec').disabled = false; }
      else s.getTracks().forEach(x => x.stop());
    } catch (e) {
      log(`asked ${want}fps -> FAILED: ${e.name} ${e.message}`, 'bad');
    }
  }
  log('\nNow tap "Record 3s" — reported fps and real fps can differ.');
});

// getSettings() states an intent; this counts frames actually delivered.
document.getElementById('rec').addEventListener('click', async () => {
  const btn = document.getElementById('rec');
  btn.disabled = true; btn.textContent = 'Recording…';
  try {
    const type = ['video/mp4', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t));
    const chunks = [];
    const mr = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
    mr.ondataavailable = e => e.data.size && chunks.push(e.data);
    const done = new Promise(r => mr.onstop = r);
    mr.start();
    await new Promise(r => setTimeout(r, 3000));
    mr.stop(); await done;

    const blob = new Blob(chunks, { type: type || 'video/mp4' });
    log(`\nrecorded ${(blob.size / 1024).toFixed(0)} KB as ${blob.type}`);

    // Play it back and count decoded frames — the same method the CMJ tool uses.
    const v = document.createElement('video');
    v.src = URL.createObjectURL(blob); v.muted = true; v.playsInline = true;
    await new Promise(r => { v.onloadedmetadata = r; v.load(); });
    log(`playback duration ${v.duration.toFixed(2)}s (recorded 3.00s of wall clock)`);
    if (v.getVideoPlaybackQuality) {
      const q0 = v.getVideoPlaybackQuality().totalVideoFrames, t0 = v.currentTime;
      await v.play();
      await new Promise(r => setTimeout(r, 1000));
      const frames = v.getVideoPlaybackQuality().totalVideoFrames - q0;
      const dt = v.currentTime - t0;
      v.pause();
      const real = dt > 0 ? frames / dt : 0;
      log(`decoded ${frames} frames over ${dt.toFixed(2)}s -> ${real.toFixed(1)} fps real`,
          real >= 120 ? 'ok' : real >= 60 ? 'warn' : 'bad');
      log(`\nVERDICT: ${real >= 120 ? 'in-app recording is worth building (' + real.toFixed(0) + 'fps, ~±' + (9.81*0.5/4*(0.5/real)*100).toFixed(1) + 'cm)'
                    : real >= 55 ? 'usable but modest (' + real.toFixed(0) + 'fps, ~±' + (9.81*0.5/4*(0.5/real)*100).toFixed(1) + 'cm) — Slo-Mo via Photo Library still wins'
                    : 'not viable (' + real.toFixed(0) + 'fps) — stick with Camera app Slo-Mo'}`);
    } else {
      log('getVideoPlaybackQuality unavailable — cannot count frames', 'warn');
    }
    URL.revokeObjectURL(v.src);
  } catch (e) {
    log('record failed: ' + e.name + ' ' + e.message, 'bad');
  }
  btn.textContent = 'Record 3s and measure real fps'; btn.disabled = false;
});
</script>
</body>
</html>
